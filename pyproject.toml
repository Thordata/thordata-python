[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "thordata"
version = "0.1.0"
description = "Python SDK for the Thordata SERP API and Web Scraper"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Thordata" }]
keywords = ["thordata", "serp", "search", "web-scraper", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://www.thordata.com/"
Documentation = "https://doc.thordata.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/thordata"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/contract-fixtures",
  "/examples",
  "/src",
  "/tests",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
